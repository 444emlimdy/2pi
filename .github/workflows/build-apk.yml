name: Build 2pi STORE APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Find Flutter project root
        id: project
        shell: bash
        run: |
          set -euo pipefail
          PUBSPEC_PATH="$(find . -type f -name pubspec.yaml -not -path '*/.dart_tool/*' -not -path '*/build/*' -print -quit)"
          if [[ -z "$PUBSPEC_PATH" ]]; then
            echo "ERROR: pubspec.yaml not found. Upload/extract the contents of 2pi_flutter into the repository."
            exit 1
          fi
          PROJECT_DIR="$(dirname "$PUBSPEC_PATH")"
          PROJECT_DIR="${PROJECT_DIR#./}"
          if [[ "$PROJECT_DIR" == "." ]]; then PROJECT_DIR=""; fi
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Flutter project directory: ${PROJECT_DIR:-.}"

      - name: Regenerate Android platform files
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        run: |
          set -euo pipefail
          if [[ -n "$PROJECT_DIR" ]]; then cd "$PROJECT_DIR"; fi
          test -f pubspec.yaml
          # Recreate the Android folder from the installed Flutter SDK to avoid
          # stale/incomplete Gradle files from an earlier archive or IDE run.
          rm -rf android
          flutter create --platforms=android --org com.twopi.store .
          test -f android/app/build.gradle || test -f android/app/build.gradle.kts
          test -f android/gradle/wrapper/gradle-wrapper.properties

      - name: Install dependencies
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        run: |
          set -euo pipefail
          if [[ -n "$PROJECT_DIR" ]]; then cd "$PROJECT_DIR"; fi
          flutter pub get

      - name: Analyze Dart code
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        run: |
          set -euo pipefail
          if [[ -n "$PROJECT_DIR" ]]; then cd "$PROJECT_DIR"; fi
          flutter analyze

      - name: Build release APK
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        run: |
          set -euo pipefail
          if [[ -n "$PROJECT_DIR" ]]; then cd "$PROJECT_DIR"; fi
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: 2pi-store-release-apk
          path: ${{ steps.project.outputs.project_dir != '' && format('{0}/build/app/outputs/flutter-apk/app-release.apk', steps.project.outputs.project_dir) || 'build/app/outputs/flutter-apk/app-release.apk' }}
          if-no-files-found: error
